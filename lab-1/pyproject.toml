[project]
name = "media-lab"
version = "0.1.0"
description = "Лабораторная работа №1 по ООП и обработке мультимедийной информации"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"